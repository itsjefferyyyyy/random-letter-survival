# Abstand zwischen zwei Runden (Sekunden)
interval-seconds: 180
# Wie lange die Blöcke verschwunden bleiben (Sekunden)
duration-seconds: 10
# Vorwarnung vor jeder Runde (Sekunden, 0 = aus)
warning-seconds: 10
# Max. Blöcke, die pro Tick entfernt/wiederhergestellt werden (gegen Lag)
blocks-per-tick: 5000
# Truhen, Öfen, Schilder usw. überspringen, damit kein Inhalt verloren geht
skip-block-entities: true
# Betroffene Welten (leer = alle)
worlds: []
# Diese Blöcke verschwinden nie
excluded-materials:
  - BEDROCK
  - END_PORTAL
  - END_PORTAL_FRAME
  - NETHER_PORTAL
  - END_GATEWAY
  - SPAWNER
  - REINFORCED_DEEPSLATE
# Eigene Sonderfälle für den Buchstaben: Block-ID → Grundname.
# Standard schon eingebaut: GRASS_BLOCK, PODZOL, MYCELIUM, ROOTED_DIRT, DIRT_PATH, FARMLAND → DIRT.
# Varianten wie POLISHED_ANDESITE → ANDESITE oder DEEPSLATE_IRON_ORE → IRON_ORE werden automatisch erkannt.
letter-aliases:
  # MUD: DIRT
